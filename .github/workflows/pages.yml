name: Project site

# Built from README.md, docs/, CHANGELOG.md, the plugin header and readme.txt.
# Deploys after the release workflow, so the version it names is published.
# Needs Settings → Pages → Source: GitHub Actions.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0  # the sitemap dates each page by its last commit

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install tooling
        run: composer install --no-interaction --prefer-dist --no-progress

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: php bin/build-site.php _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
